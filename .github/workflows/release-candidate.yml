name: Release Package Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-verify-and-upload:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: 1.1.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build, test and package Release Candidate
        shell: pwsh
        run: |
          $env:ISCC_PATH = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          ./scripts/build-release-candidate.ps1 -Version $env:RELEASE_VERSION
      - name: Verify installer and portable behavior
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/verify-rc-packages.ps1 -Version $env:RELEASE_VERSION
      - name: Download supported upgrade baselines
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/previous-releases | Out-Null
          foreach ($version in @('1.0.0', '1.0.1', '1.0.2')) {
            gh release download "v$version" --dir artifacts/previous-releases --pattern "Quick-Response-Bao-Setup-$version-x64.exe"
          }
      - name: Verify v1.0.0, v1.0.1 and v1.0.2 upgrades
        shell: pwsh
        timeout-minutes: 15
        run: |
          foreach ($version in @('1.0.0', '1.0.1', '1.0.2')) {
            ./scripts/verify-version-upgrade.ps1 `
              -PreviousVersion $version `
              -PreviousSetup "artifacts/previous-releases/Quick-Response-Bao-Setup-$version-x64.exe" `
              -CurrentVersion $env:RELEASE_VERSION `
              -CurrentSetup "artifacts/Quick-Response-Bao-Setup-$env:RELEASE_VERSION-x64.exe"
          }
      - name: Run clean-tree release preflight
        shell: pwsh
        run: ./scripts/preflight-release.ps1 -Version $env:RELEASE_VERSION -SkipBuildAndTests
      - uses: actions/upload-artifact@v7
        with:
          name: Quick-Response-Bao-1.1.0-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/Quick-Response-Bao-Setup-1.1.0-x64.exe
            artifacts/Quick-Response-Bao-1.1.0-Portable-x64.zip
            artifacts/checksums.txt
            docs/releases/v1.1.0.md
