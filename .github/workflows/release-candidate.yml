name: Release Package Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-verify-and-upload:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: 1.0.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build, test and package Release Candidate
        shell: pwsh
        run: |
          $env:ISCC_PATH = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          ./scripts/build-release-candidate.ps1 -Version $env:RELEASE_VERSION
      - name: Verify installer and portable behavior
        shell: pwsh
        run: ./scripts/verify-rc-packages.ps1 -Version $env:RELEASE_VERSION
      - name: Run clean-tree release preflight
        shell: pwsh
        run: ./scripts/preflight-release.ps1 -Version $env:RELEASE_VERSION -SkipBuildAndTests
      - uses: actions/upload-artifact@v4
        with:
          name: Quick-Response-Bao-1.0.2-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/Quick-Response-Bao-Setup-1.0.2-x64.exe
            artifacts/Quick-Response-Bao-Portable-1.0.2-x64.zip
            artifacts/checksums.txt
            docs/release-notes-1.0.2.md
