name: Release

on:
  push:
    tags: ['v1.1.0']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: 1.1.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build, test and package stable release
        shell: pwsh
        run: |
          $env:ISCC_PATH = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          ./scripts/build-release-candidate.ps1 -Version $env:RELEASE_VERSION
      - name: Run clean-tree release preflight
        shell: pwsh
        run: ./scripts/preflight-release.ps1 -Version $env:RELEASE_VERSION -SkipBuildAndTests
      - name: Verify locally built installer and portable package
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/verify-rc-packages.ps1 -Version $env:RELEASE_VERSION
      - name: Download supported upgrade baselines
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/previous-releases | Out-Null
          foreach ($version in @('1.0.0', '1.0.1', '1.0.2')) {
            gh release download "v$version" --dir artifacts/previous-releases --pattern "Quick-Response-Bao-Setup-$version-x64.exe"
          }
      - name: Verify supported upgrade paths before publishing
        shell: pwsh
        timeout-minutes: 15
        run: |
          foreach ($version in @('1.0.0', '1.0.1', '1.0.2')) {
            ./scripts/verify-version-upgrade.ps1 `
              -PreviousVersion $version `
              -PreviousSetup "artifacts/previous-releases/Quick-Response-Bao-Setup-$version-x64.exe" `
              -CurrentVersion $env:RELEASE_VERSION `
              -CurrentSetup "artifacts/Quick-Response-Bao-Setup-$env:RELEASE_VERSION-x64.exe"
          }
      - name: Create stable GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Quick Response Bao v1.1.0
          body_path: docs/releases/v1.1.0.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            artifacts/Quick-Response-Bao-Setup-1.1.0-x64.exe
            artifacts/Quick-Response-Bao-1.1.0-Portable-x64.zip
            artifacts/checksums.txt
      - name: Download assets back from GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release-download | Out-Null
          gh release download v1.1.0 --dir artifacts/release-download --pattern 'Quick-Response-Bao-Setup-1.1.0-x64.exe' --pattern 'Quick-Response-Bao-1.1.0-Portable-x64.zip' --pattern 'checksums.txt'
      - name: Verify downloaded checksums, installation, startup and user-data retention
        shell: pwsh
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $download = Join-Path $PWD 'artifacts/release-download'
          $manifest = Get-Content (Join-Path $download 'checksums.txt') -Raw
          foreach ($name in @('Quick-Response-Bao-Setup-1.1.0-x64.exe', 'Quick-Response-Bao-1.1.0-Portable-x64.zip')) {
            $hash = (Get-FileHash (Join-Path $download $name) -Algorithm SHA256).Hash
            if ($manifest -notmatch "(?im)^$hash\s+$([regex]::Escape($name))\s*$") { throw "Downloaded SHA-256 mismatch: $name" }
          }
          ./scripts/verify-rc-packages.ps1 -Version 1.1.0 -PackageDirectory $download
          ./scripts/verify-version-upgrade.ps1 `
            -PreviousVersion 1.0.2 `
            -PreviousSetup artifacts/previous-releases/Quick-Response-Bao-Setup-1.0.2-x64.exe `
            -CurrentVersion 1.1.0 `
            -CurrentSetup artifacts/release-download/Quick-Response-Bao-Setup-1.1.0-x64.exe
      - name: Verify public automatic-update discovery
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-public-release.ps1 -Version 1.1.0
