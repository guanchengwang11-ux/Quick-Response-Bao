name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore QuickResponseBao.sln --runtime win-x64
      - run: dotnet build src/QuickResponseBao.App/QuickResponseBao.App.csproj --configuration Release --runtime win-x64 --no-restore
      - run: dotnet build src/QuickResponseBao.Updater/QuickResponseBao.Updater.csproj --configuration Release --runtime win-x64 --no-restore
      - run: dotnet test tests/QuickResponseBao.UnitTests/QuickResponseBao.UnitTests.csproj --configuration Release --runtime win-x64 --no-restore
