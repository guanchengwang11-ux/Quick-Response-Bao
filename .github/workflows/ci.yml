name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore QuickResponseBao.sln
      - run: dotnet build QuickResponseBao.sln --configuration Release --no-restore
      - run: dotnet test QuickResponseBao.sln --configuration Release --no-build --no-restore
